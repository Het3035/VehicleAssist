<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<title>Contact the vehicle owner</title><meta data-doctitle="ct.title"><link rel="stylesheet" href="/style.css?v=4">
</head><body><div class="wrap">
<div class="top"><a class="brand" href="/">Vehicle<span>Assist</span></a>
  <div class="row"><select class="lang-sel" id="lang" data-al="lang.label"></select><span class="pill on" id="priv"></span></div></div>
<div class="chat" id="chat" aria-live="polite"></div>
<div id="panel"></div>
<script src="/i18n.js?v=5"></script>
<script>
const tt=(k,v)=>I18N.t(k,v);
// shrink a photo on the phone before it is sent: at most ~900 px wide, JPEG, around 100 KB
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
    let max=900,q=0.72,out='';
    for(let k=0;k<4;k++){
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);
      if(out.length<480000)return out;
      max=Math.round(max*.75);q-=.1;
    }
    throw new Error('too big');
  }finally{URL.revokeObjectURL(url);}
}
const KEYS={photo:'ct.photo',photobad:'ct.photobad',photorm:'ct.photorm',priv:'ct.priv',hi:'ct.hi',which:'ct.which',ph:'ct.ph',find:'ct.find',away:'ct.away',issue:'ct.issue',details:'ct.details',msgPh:'ct.msgph',msgReq:'ct.msgreq',phone:'ct.phone',loc:'ct.loc',send:'ct.send',done:'ct.done',call:'ct.call',home:'common.home',nf:'ct.nf',unreg:'err.unreg',wait:'ct.wait',owner:'common.owner',reply:'ct.reply',sendS:'ct.sends',prev:'ct.prev',cont:'ct.cont',new:'ct.new',cap:'err.cap',rate:'err.rate',threadcap:'err.threadcap',dup:'ct.dup',muted:'ct.muted',vnum:'ct.vnum'};
const t=k=>tt(KEYS[k]||k);
const friendly=e=>({vehicle_cap:t('cap'),rate:t('rate'),thread_cap:t('threadcap')}[e.code]||I18N.tErr(e.message));
const $=id=>document.getElementById(id);
const chat=$('chat'),panel=$('panel');
const J=(u,body)=>fetch(u,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||'Something went wrong');e.code=j.code;throw e;}return j;});
const el=(tag,p={},...k)=>{const e=Object.assign(document.createElement(tag),p);k.flat().forEach(x=>e.append(x));return e;};
const say=(x,who='bot')=>{chat.append(el('div',{className:'bub '+who,textContent:x}));scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
const clear=()=>panel.replaceChildren();
const store={get:k=>{try{return localStorage.getItem(k)}catch(_){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}} ,del:k=>{try{localStorage.removeItem(k)}catch(_){}}};
const pathTok=location.pathname.startsWith('/v/')?location.pathname.split('/').pop():null;
let token=null,info=null,kind=null,pollTimer=null,step=null;
const kindText=k=>I18N.D.en['kind.'+k.id]?tt('kind.'+k.id):k.text;

const ls=$('lang');I18N.LANGS.forEach(([c,n])=>ls.append(el('option',{value:c,textContent:n})));ls.value=I18N.getLang();
ls.onchange=()=>{I18N.setLang(ls.value);};
window.addEventListener('langchange',()=>{ls.value=I18N.getLang();start();});
function start(){clearInterval(pollTimer);chat.replaceChildren();$('priv').textContent=t('priv');say(t('hi'));
  if(pathTok){token=pathTok;load();}else askNumber();}

function askNumber(err){
  clear();if(err)say(err);say(t('which'));
  const inp=el('input',{className:'plate-input',type:'text',placeholder:t('ph'),autocomplete:'off',autocapitalize:'characters',ariaLabel:t('vnum')});
  const go=el('button',{className:'btn block',style:'margin-top:10px',textContent:t('find')});
  const submit=async()=>{const n=inp.value.trim();if(!n)return;go.disabled=true;say(n.toUpperCase(),'me');
    try{const r=await J('/api/contact/lookup',{number:n});token=r.token;await load();}catch(e){askNumber(e.message==='This vehicle is not registered on the app yet'?t('unreg'):I18N.tErr(e.message));}};
  go.onclick=submit;inp.onkeydown=e=>{if(e.key==='Enter')submit();};
  panel.append(inp,go);inp.focus();
  const pre=new URLSearchParams(location.search).get('n');
  if(pre&&!window.__pre){window.__pre=1;inp.value=pre;submit();}
}
async function load(){
  try{info=await J('/api/public/'+encodeURIComponent(token));}catch(e){clear();say(t('nf'));return;}
  say(info.label?tt('ct.foundl',{n:info.number,l:info.label}):tt('ct.found',{n:info.number}));
  if(info.awayMsg)say(t('away')+info.awayMsg);
  const saved=store.get('thr:'+token);
  if(saved){try{await J('/api/thread/'+encodeURIComponent(saved));
    clear();say(t('prev'));
    panel.append(el('button',{className:'btn block',textContent:t('cont'),onclick:()=>showThread(saved)}),
      el('button',{className:'btn ghost block',style:'margin-top:8px',textContent:t('new'),onclick:askIssue}));return;}catch(_){store.del('thr:'+token);}}
  askIssue();
}
function askIssue(){
  clear();say(t('issue'));
  const box=el('div',{className:'chips'});
  info.kinds.forEach(k=>box.append(el('button',{type:'button',textContent:kindText(k),onclick:()=>{kind=k;say(kindText(k),'me');askDetails();}})));
  panel.append(box);
}
function askDetails(){
  clear();say(t('details'));
  const text=el('textarea',{maxLength:300,placeholder:kind.id==='other'?t('msgReq'):t('msgPh'),ariaLabel:t('details')});
  const contact=el('input',{type:'tel',placeholder:t('phone'),autocomplete:'tel',ariaLabel:t('phone'),style:'margin-top:8px'});
  const loc=el('input',{type:'checkbox'});
  let photo=null;
  const file=el('input',{type:'file',accept:'image/*',style:'display:none'});
  const pbtn=el('button',{type:'button',className:'btn ghost block',style:'margin-top:8px',textContent:t('photo')});
  const prev=el('div',{style:'margin-top:8px'});
  const perr=el('div');
  pbtn.onclick=()=>file.click();
  file.onchange=async()=>{perr.replaceChildren();const f=file.files[0];if(!f)return;
    try{photo=await shrink(f);prev.replaceChildren(el('img',{src:photo,alt:'',style:'max-width:100%;max-height:180px;border-radius:8px;border:1px solid #d6d9d2;display:block'}),
      el('button',{type:'button',className:'btn ghost sm',style:'margin-top:6px',textContent:t('photorm'),onclick:()=>{photo=null;file.value='';prev.replaceChildren();}}));}
    catch(_){photo=null;prev.replaceChildren();perr.replaceChildren(el('div',{className:'msg err',textContent:t('photobad')}));}};
  const send=el('button',{className:'btn block',style:'margin-top:10px',textContent:t('send')});
  const out=el('div');
  send.onclick=async()=>{
    send.disabled=true;
    try{
      let lat=null,lng=null;
      if(loc.checked){try{const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{timeout:8000,maximumAge:60000}));lat=p.coords.latitude;lng=p.coords.longitude;}catch(_){}}
      const r=await J('/api/public/'+encodeURIComponent(token)+'/alert',{kind:kind.id,text:text.value,contact:contact.value,lat,lng,photo});
      if(r.duplicate){clear();say(t('dup'));panel.append(el('a',{className:'btn ghost block',href:'/',textContent:t('home')}));return;}
      store.set('thr:'+token,r.thread);
      if(text.value.trim())say(text.value.trim(),'me');
      say(t('done'));
      if(r.muted)say(t('muted'));
      showThread(r.thread,true);
    }catch(e){send.disabled=false;out.replaceChildren(el('div',{className:'msg err',textContent:friendly(e)}));out.scrollIntoView({behavior:'smooth',block:'nearest'});}
  };
  panel.append(text,contact,pbtn,file,prev,perr,el('label',{className:'check'},loc,el('span',{textContent:t('loc')})),send,out);text.focus();
}
function showThread(secret,fresh){
  clear();
  if(!fresh)chat.replaceChildren();
  const shown=new Set();let waiting=null;
  const render=d=>{
    if(!fresh&&!shown.has('root')){shown.add('root');say((d.kind&&I18N.D.en['kind.'+d.kind]?tt('kind.'+d.kind):d.kindText)+(d.text?': '+d.text:''),'me');}
    d.msgs.forEach(m=>{const k=m.id||m.created+m.who+m.text;if(shown.has(k))return;shown.add(k);if(waiting){waiting.remove();waiting=null;}
      const b=el('div',{className:'bub '+(m.who==='owner'?'bot':'me')},m.who==='owner'?el('small',{textContent:t('owner')}):'',m.text);chat.append(b);});
    if(!d.msgs.some(m=>m.who==='owner')&&!waiting){waiting=el('div',{className:'bub bot',style:'opacity:.7',textContent:t('wait')});chat.append(waiting);}
    scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  };
  const poll=()=>J('/api/thread/'+encodeURIComponent(secret)).then(render).catch(()=>{});
  poll();clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden)poll();},5000);
  const inp=el('input',{type:'text',maxLength:300,placeholder:t('reply'),ariaLabel:t('reply')});
  const go=el('button',{className:'btn block',style:'margin-top:8px',textContent:t('sendS')});
  const sendIt=async()=>{const v=inp.value.trim();if(!v)return;go.disabled=true;try{await J('/api/thread/'+encodeURIComponent(secret),{text:v});inp.value='';await poll();}catch(e){say(friendly(e));}go.disabled=false;};
  go.onclick=sendIt;inp.onkeydown=e=>{if(e.key==='Enter')sendIt();};
  panel.append(inp,go);
  if(info&&info.allowCall&&info.phone)panel.append(el('a',{className:'btn ghost block',style:'margin-top:8px',href:'tel:'+info.phone,textContent:t('call')}));
  panel.append(el('a',{className:'btn ghost block',style:'margin-top:8px',href:'/',textContent:t('home')}));
}
start();
</script><p class="meta" style="text-align:center;margin-top:24px"><a href="/privacy" data-i="ft.privacy">Privacy</a></p></div></body></html>
