<script>
let site={};
function render(){
  const T=I18N.t;
  document.getElementById('retention').textContent=site.retentionDays>0?T('pr.ret',{d:site.retentionDays}):T('pr.ret0');
  const c=document.getElementById('contact');
  if(site.contactEmail){const parts=T('pr.cont1',{e:'\u0000'}).split('\u0000');c.textContent=parts[0];const a=document.createElement('a');a.href='mailto:'+site.contactEmail;a.textContent=site.contactEmail;c.append(a,parts[1]||'');}
  else c.textContent=T('pr.cont0');
}
window.addEventListener('langchange',render);
fetch('/api/site').then(r=>r.json()).then(s=>{site=s;render();}).catch(render);
</script>
